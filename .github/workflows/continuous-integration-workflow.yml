name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request: {}
  #push:
  #  branches: [ master ]

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  ubuntu-build:
    name: Ubuntu CI (Legacy renderer enabled)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          scripts/install-dependencies.sh gl
          sudo apt-get -y install freeglut3-dev libegl1-mesa-dev
          cmake -S . -B cmake_build_dir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=ON -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON -DCOIN_STRICT_WARNINGS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release --parallel
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release --parallel
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Artifacts-LegacyGL-ON
          path: cmake_install_dir/
        if: always()

  ubuntu-core:
    name: Ubuntu core-header smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          cmake -S . -B cmake_build_dir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOIN_BUILD_LEGACY_GL_RENDERER=OFF -DCOIN_BUILD_TESTS=OFF -DCOIN_BUILD_EXAMPLES=OFF -DCOIN_BUILD_DOCUMENTATION=OFF
      - name: Build core GL glue
        run: cmake --build cmake_build_dir --target glue --config Release --parallel

  ubuntu-core-profile-runtime:
    name: Ubuntu CI (core-profile runtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          scripts/install-dependencies.sh gl
          sudo apt-get -y install freeglut3-dev libegl1-mesa-dev xvfb
          cmake -S . -B cmake_build_dir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOIN_BUILD_LEGACY_GL_RENDERER=ON -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON -DCOIN_BUILD_EXAMPLES=OFF -DCOIN_BUILD_DOCUMENTATION=OFF
      - name: Build OpenGL tests
        run: cmake --build cmake_build_dir --target EGLBindingTest GLSLRuntimeTest GLSLDiagnosticsTest OffscreenReadbackTest --config Release --parallel
      - name: Run generic core-profile tests
        run: xvfb-run -a ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Run EGL tests
        run: ctest -C Release -L requires-egl --output-on-failure
        working-directory: cmake_build_dir

  windows-build:
    name: Windows CI (Legacy renderer enabled)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install test dependencies
        shell: bash
        run: scripts/install-dependencies.sh gl
      - name: Create build directory and run CMake
        shell: cmd
        run: |
          cmake -S . -B cmake_build_dir -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=ON -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target INSTALL --config Release --parallel 2
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Artifacts-LegacyGL-ON
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS CI (Legacy renderer enabled)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install test dependencies
        run: scripts/install-dependencies.sh gl
      - name: Create build directory and run CMake
        run: |
          cmake -S . -B cmake_build_dir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCMAKE_CXX_STANDARD=11 -DCOIN_BUILD_LEGACY_GL_RENDERER=ON -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release --parallel
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macOS-Artifacts-LegacyGL-ON
          path: cmake_install_dir/
        if: always()
