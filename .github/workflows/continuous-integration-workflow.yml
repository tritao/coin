name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
  #push:
  #  branches: [ master ]

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  ubuntu-build:
    name: Ubuntu CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
            artifact: Ubuntu-Artifacts-LegacyGL-ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
            artifact: Ubuntu-Artifacts-LegacyGL-OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            freeglut3-dev libyaml-cpp-dev libglfw3-dev \
            libgl1-mesa-dri mesa-utils xvfb ninja-build
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=cmake_install_dir \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} \
            -DCOIN_BUILD_TESTS=ON \
            -DCOIN_BUILD_GL_TESTS=ON \
            -DCOIN_FETCH_TEST_DEPENDENCIES=OFF \
            -DCOIN_BUILD_EXAMPLES=OFF \
            -DCOIN_BUILD_DOCUMENTATION=OFF \
            -DCOIN_STRICT_WARNINGS=ON
      - name: Build and install
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release -- -j4
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run generic core OpenGL tests
        run: xvfb-run -a ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Run compatibility OpenGL tests
        if: matrix.renderer_state == 'enabled'
        run: xvfb-run -a ctest -C Release -L gl-compat --output-on-failure
        working-directory: cmake_build_dir
      - name: Run EGL implementation-contract tests
        run: ctest -C Release -L requires-egl --output-on-failure
        working-directory: cmake_build_dir
      - name: Configure visual tests
        if: matrix.renderer_state == 'enabled'
        run: |
          cmake -S . -B cmake_build_dir_rt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOIN_BUILD_TESTS=OFF \
            -DCOIN_BUILD_EXAMPLES=OFF \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} \
            -DCOIN_BUILD_VISUAL_TESTS=ON \
            -DCOIN_FETCH_TEST_DEPENDENCIES=OFF
      - name: Build visual tests
        if: matrix.renderer_state == 'enabled'
        run: cmake --build cmake_build_dir_rt --config Release -- -j4
      - name: Run visual contract suite
        if: matrix.renderer_state == 'enabled'
        run: ctest --test-dir cmake_build_dir_rt -L visual-contract --output-on-failure -VV
      - name: Run visual rendering suite
        if: matrix.renderer_state == 'enabled'
        run: xvfb-run -a ctest --test-dir cmake_build_dir_rt -L visual-render --output-on-failure -VV
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cmake_install_dir/
        if: always()
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v7
        if: always() && matrix.renderer_state == 'enabled'
        with:
          name: Ubuntu-VisualTest-Artifacts
          path: |
            cmake_build_dir_rt/render_artifacts/
            cmake_build_dir_rt/Testing/

  windows-build:
    name: Windows CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
            artifact: Windows-Artifacts-LegacyGL-ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
            artifact: Windows-Artifacts-LegacyGL-OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B cmake_build_dir -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON -DCOIN_FETCH_TEST_DEPENDENCIES=ON
      - name: Build and install
        run: cmake --build cmake_build_dir --target INSTALL --config Release -- /nologo /verbosity:minimal /maxcpucount:2 /property:MultiProcessorCompilation=true
      - name: Check installed package
        shell: pwsh
        run: |
          $smokeSource = Join-Path $env:GITHUB_WORKSPACE "testsuite/installed-package-smoke"
          $smokeBuild = Join-Path $env:RUNNER_TEMP "coin-installed-package-smoke"
          $installedPrefix = (Join-Path $env:GITHUB_WORKSPACE "cmake_install_dir").Replace('\', '/')
          cmake -S $smokeSource -B $smokeBuild -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$installedPrefix"
          cmake --build $smokeBuild --config Release
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run generic core OpenGL tests
        run: ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Run compatibility OpenGL tests
        if: matrix.renderer_state == 'enabled'
        run: ctest -C Release -L gl-compat --output-on-failure
        working-directory: cmake_build_dir
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
            artifact: macOS-Artifacts-LegacyGL-ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
            artifact: macOS-Artifacts-LegacyGL-OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=cmake_install_dir \
            -DCMAKE_CXX_STANDARD=11 \
            -DCOIN_STRICT_WARNINGS=ON \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} \
            -DCOIN_BUILD_TESTS=ON \
            -DCOIN_BUILD_GL_TESTS=ON \
            -DCOIN_FETCH_TEST_DEPENDENCIES=ON
      - name: Build and install
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release -- -j4
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run generic core OpenGL tests
        run: ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cmake_install_dir/
        if: always()
