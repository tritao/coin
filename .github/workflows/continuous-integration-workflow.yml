name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
  #push:
  #  branches: [ master ]

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  ubuntu-compatibility:
    name: Ubuntu CI (GL compatibility)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=ON -DCOIN_BUILD_TESTS=ON -DCOIN_STRICT_WARNINGS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release -- -j4
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Diagnose Ubuntu CoinTests crash
        if: always()
        working-directory: cmake_build_dir
        run: |
          coin_tests="$(pwd)/bin/CoinTests"
          failures=0

          run_probe() {
            name="$1"
            shift
            echo "=== CoinTests probe: ${name} ==="
            if "$coin_tests" "$@"; then
              status=0
            else
              status=$?
            fi
            echo "=== CoinTests probe: ${name} exit code ${status} ==="
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          }

          run_repeated_probe() {
            name="$1"
            shift
            repeat_failures=0
            for attempt in $(seq 1 20); do
              log_file="$RUNNER_TEMP/${name}-${attempt}.log"
              if "$coin_tests" "$@" >"$log_file" 2>&1; then
                status=0
              else
                status=$?
              fi
              echo "=== CoinTests probe: ${name} attempt ${attempt}/20 exit code ${status} ==="
              if [ "$status" -ne 0 ]; then
                repeat_failures=$((repeat_failures + 1))
                tail -n 80 "$log_file"
              fi
            done
            failures=$((failures + repeat_failures))
            echo "=== CoinTests probe: ${name} failures ${repeat_failures}/20 ==="
          }

          run_probe "single-167" --test models_dead_simple_all_iv_iv
          run_probe "single-168" --test models_dead_simple_array_iv
          run_repeated_probe "repeat-prefix-166-then-167" --max-tests 166 --append-test models_dead_simple_all_iv_iv

          if [ "$failures" -ne 0 ]; then
            echo "${failures} CoinTests diagnostic probe(s) failed" >&2
            exit 1
          fi
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Artifacts-GL-compatibility
          path: cmake_install_dir/
        if: always()

  ubuntu-core-build:
    name: Ubuntu CI (GL core build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=OFF -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_EXAMPLES=OFF -DCOIN_BUILD_DOCUMENTATION=OFF
      - name: Build core Coin library
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release -- -j4
      - name: Run core tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Run core-context runtime tests
        run: ctest -C Release -R '^(EGLBindingTest|GLSLRuntimeTest|OffscreenReadbackTest)$' --output-on-failure
        working-directory: cmake_build_dir
        env:
          COIN_EGL: 1
          EGL_PLATFORM: surfaceless
          COIN_EGL_CORE_PROFILE: 1

  windows-build:
    name: Windows CI (${{ matrix.renderer }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: LegacyGL ON
            legacy_gl_renderer: ON
            artifact: Windows-Artifacts-LegacyGL-ON
          - renderer: LegacyGL OFF
            legacy_gl_renderer: OFF
            artifact: Windows-Artifacts-LegacyGL-OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        shell: cmd
        run: |
          cmake -S . -B cmake_build_dir -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target INSTALL --config Release -- /nologo /verbosity:minimal /maxcpucount:2 /property:MultiProcessorCompilation=true
      - name: Check installed package
        shell: pwsh
        run: |
          $smokeSource = Join-Path $env:GITHUB_WORKSPACE "testsuite/installed-package-smoke"
          $smokeBuild = Join-Path $env:RUNNER_TEMP "coin-installed-package-smoke"
          $installedPrefix = (Join-Path $env:GITHUB_WORKSPACE "cmake_install_dir").Replace('\', '/')
          cmake -S $smokeSource -B $smokeBuild -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$installedPrefix"
          cmake --build $smokeBuild --config Release
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Diagnose Windows CoinTests crash
        if: always()
        shell: pwsh
        working-directory: cmake_build_dir
        run: |
          if (-not (Select-String -Path "CMakeCache.txt" -Pattern "^COIN_BUILD_LEGACY_GL_RENDERER:BOOL=ON$")) {
            Write-Host "Skipping LegacyGL-only CoinTests probes for the core build"
            exit 0
          }

          $coinTests = Join-Path (Get-Location) "bin\CoinTests.exe"
          $script:failures = 0

          function Invoke-CoinProbe {
            param(
              [string]$Name,
              [string[]]$Arguments
            )

            Write-Host "=== CoinTests probe: $Name ==="
            & $coinTests @Arguments
            $exitCode = $LASTEXITCODE
            Write-Host "=== CoinTests probe: $Name exit code $exitCode ==="
            if ($exitCode -ne 0) {
              $script:failures += 1
            }
          }

          function Invoke-RepeatedCoinProbe {
            param(
              [string]$Name,
              [string[]]$Arguments
            )

            $safeName = $Name -replace '[^A-Za-z0-9_-]', '_'
            $repeatFailures = 0
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $logFile = Join-Path $env:RUNNER_TEMP "${safeName}-${attempt}.log"
              & $coinTests @Arguments *> $logFile
              $exitCode = $LASTEXITCODE
              Write-Host "=== CoinTests probe: $Name attempt $attempt/20 exit code $exitCode ==="
              if ($exitCode -ne 0) {
                $repeatFailures += 1
                Get-Content $logFile -Tail 80
              }
            }
            $script:failures += $repeatFailures
            Write-Host "=== CoinTests probe: $Name failures $repeatFailures/20 ==="
          }

          Invoke-CoinProbe "single-167" @("--test", "models_dead_simple_all_iv_iv")
          Invoke-CoinProbe "single-168" @("--test", "models_dead_simple_array_iv")
          Invoke-RepeatedCoinProbe "repeat-prefix-166-then-167" @("--max-tests", "166", "--append-test", "models_dead_simple_all_iv_iv")

          if ($script:failures -ne 0) {
            Write-Error "$script:failures CoinTests diagnostic probe(s) failed"
            exit 1
          }
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cmake_install_dir/
        if: always()

  ubuntu-cointests-sanitizers:
    name: Ubuntu CoinTests ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create sanitizer build
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          cmake -S . -B cmake_asan -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=ON \
            -DCOIN_BUILD_TESTS=ON \
            -DCOIN_BUILD_DOCUMENTATION=OFF \
            -DCOIN_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build CoinTests
        run: cmake --build cmake_asan --target CoinTests --parallel 4
      - name: Repeat sanitizer replay
        working-directory: cmake_asan
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          coin_tests="$PWD/bin/CoinTests"
          failures=0
          for attempt in $(seq 1 20); do
            log_file="$RUNNER_TEMP/coin-asan-${attempt}.log"
            if "$coin_tests" --max-tests 166 --append-test models_dead_simple_all_iv_iv >"$log_file" 2>&1; then
              status=0
            else
              status=$?
            fi
            echo "=== ASan replay attempt ${attempt}/20 exit code ${status} ==="
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              cat "$log_file"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "${failures} sanitizer replay(s) failed" >&2
            exit 1
          fi
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-CoinTests-sanitizer-logs
          path: ${{ runner.temp }}/coin-asan-*.log
          if-no-files-found: warn

  windows-cointests-sanitizer:
    name: Windows CoinTests MSVC ASan
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create sanitizer build
        shell: pwsh
        run: |
          cmake -S . -B cmake_asan -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_INSTALL_PREFIX=cmake_asan_install `
            -DCOIN_BUILD_LEGACY_GL_RENDERER=ON `
            -DCOIN_BUILD_TESTS=ON `
            -DCOIN_BUILD_DOCUMENTATION=OFF `
            -DCOIN_BUILD_EXAMPLES=OFF `
            "-DCMAKE_C_FLAGS=/fsanitize=address /Zi" `
            "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi"
      - name: Build CoinTests
        shell: pwsh
        run: |
          cmake --build cmake_asan --target CoinTests --config RelWithDebInfo -- /nologo /verbosity:minimal /maxcpucount:2
      - name: Repeat sanitizer replay
        shell: pwsh
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1:detect_leaks=0"
        run: |
          $coinTests = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "cmake_asan\bin") -Filter CoinTests.exe -Recurse | Select-Object -First 1
          if (-not $coinTests) { throw "CoinTests.exe not found" }
          $failures = 0
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            $logFile = Join-Path $env:RUNNER_TEMP "coin-msvc-asan-$attempt.log"
            $dumpFile = Join-Path $env:RUNNER_TEMP "coin-msvc-asan-$attempt.dmp"
            $env:ASAN_SAVE_DUMPS = $dumpFile
            & $coinTests.FullName --max-tests 166 --append-test models_dead_simple_all_iv_iv *> $logFile
            $exitCode = $LASTEXITCODE
            Write-Host "=== MSVC ASan replay attempt $attempt/20 exit code $exitCode ==="
            if ($exitCode -ne 0) {
              $failures += 1
              Get-Content $logFile
            }
          }
          if ($failures -ne 0) {
            throw "$failures sanitizer replay(s) failed"
          }
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-CoinTests-msvc-asan-diagnostics
          path: |
            ${{ runner.temp }}/coin-msvc-asan-*.log
            ${{ runner.temp }}/coin-msvc-asan-*.dmp
          if-no-files-found: warn

  macos-build:
    name: macOS CI (${{ matrix.renderer }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: LegacyGL ON
            legacy_gl_renderer: ON
            artifact: macOS-Artifacts-LegacyGL-ON
          - renderer: LegacyGL OFF
            legacy_gl_renderer: OFF
            artifact: macOS-Artifacts-LegacyGL-OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCMAKE_CXX_STANDARD=11 -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release -- -j4
      - name: Run tests
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cmake_install_dir/
        if: always()
